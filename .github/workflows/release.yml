name: release

# Desktop installers + ghcr image.
#   push tag v*        → build all three OSes, attach to the GitHub release, push ghcr :<ver> and :latest
#   workflow_dispatch  → dry run on any ref: builds everything, uploads workflow artifacts only

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build installers
        run: pnpm ${{ matrix.script }}
        env:
          # Unsigned builds on purpose: no Apple/Windows certs yet. README tells
          # macOS users to clear the quarantine bit.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage release/*.deb)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: ghcr image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ashark-ai-05/opencanvas
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name oc -p 127.0.0.1:3457:3457 "$tag"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3457/v1/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3457/v1/health
          docker logs oc | tail -20
          docker rm -f oc
