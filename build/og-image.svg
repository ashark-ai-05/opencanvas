<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Subtle radial gradient: violet glow off the right side, fading into
         the dark zinc background. Echoes the in-app theme. -->
    <radialGradient id="bg" cx="0.75" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#7c3aed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#18181b" stop-opacity=".92"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="brandText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="o"/>
      <feComponentTransfer in="o"><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base: zinc 950 -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <!-- Violet glow accent -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Faint grid for the "canvas" feel -->
  <g stroke="#262626" stroke-width="1" opacity=".25">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Left: brand + tagline + meta chips -->
  <g transform="translate(72 0)">
    <!-- Tiny "OPENCANVAS" eyebrow + product mark -->
    <g transform="translate(0 130)">
      <rect width="14" height="14" rx="3" fill="#a78bfa"/>
      <text x="24" y="12" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, Roboto, system-ui"
            font-size="14" font-weight="600" letter-spacing="0.18em" fill="#a78bfa">OPENCANVAS</text>
    </g>

    <!-- Headline -->
    <text x="0" y="240" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, Roboto, system-ui"
          font-size="68" font-weight="700" letter-spacing="-0.025em" fill="url(#brandText)">
      An infinite canvas
    </text>
    <text x="0" y="316" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, Roboto, system-ui"
          font-size="68" font-weight="700" letter-spacing="-0.025em" fill="url(#brandText)">
      your LLM draws on.
    </text>

    <!-- Sub-tagline -->
    <text x="0" y="372" font-family="ui-sans-serif, -apple-system, Inter, Segoe UI, Roboto, system-ui"
          font-size="22" font-weight="400" fill="#a1a1aa">
      Ask anything → the agent renders typed widgets on a tldraw canvas.
    </text>

    <!-- Meta chips row -->
    <g transform="translate(0 430)">
      <g transform="translate(0 0)">
        <rect width="120" height="30" rx="15" fill="rgba(167,139,250,.12)" stroke="rgba(167,139,250,.35)" stroke-width="1"/>
        <text x="60" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui"
              font-size="13" font-weight="500" fill="#c4b5fd">BYO model</text>
      </g>
      <g transform="translate(132 0)">
        <rect width="100" height="30" rx="15" fill="rgba(167,139,250,.12)" stroke="rgba(167,139,250,.35)" stroke-width="1"/>
        <text x="50" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui"
              font-size="13" font-weight="500" fill="#c4b5fd">MCP-native</text>
      </g>
      <g transform="translate(244 0)">
        <rect width="110" height="30" rx="15" fill="rgba(167,139,250,.12)" stroke="rgba(167,139,250,.35)" stroke-width="1"/>
        <text x="55" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui"
              font-size="13" font-weight="500" fill="#c4b5fd">Local-first</text>
      </g>
      <g transform="translate(366 0)">
        <rect width="64" height="30" rx="15" fill="rgba(167,139,250,.12)" stroke="rgba(167,139,250,.35)" stroke-width="1"/>
        <text x="32" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui"
              font-size="13" font-weight="500" fill="#c4b5fd">MIT</text>
      </g>
    </g>
  </g>

  <!-- Right: small canvas-with-widgets vignette -->
  <g transform="translate(720 110)" filter="url(#cardShadow)">
    <!-- Card 1 -->
    <g transform="translate(0 0) rotate(-4)">
      <rect width="320" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="22" y="24" width="120" height="14" rx="7" fill="rgba(255,255,255,.85)"/>
      <rect x="22" y="50" width="260" height="8" rx="4" fill="rgba(255,255,255,.45)"/>
      <rect x="22" y="68" width="220" height="8" rx="4" fill="rgba(255,255,255,.35)"/>
      <rect x="22" y="86" width="240" height="8" rx="4" fill="rgba(255,255,255,.35)"/>
      <rect x="22" y="104" width="190" height="8" rx="4" fill="rgba(255,255,255,.35)"/>
    </g>
    <!-- Card 2 with sparkline chart -->
    <g transform="translate(170 180) rotate(3)">
      <rect width="280" height="180" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="22" y="24" width="100" height="14" rx="7" fill="rgba(244,114,182,.85)"/>
      <polyline points="22,140 70,90 110,110 150,60 190,80 230,42 258,46"
                fill="none" stroke="#f0abfc" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="258" cy="46" r="6" fill="#f0abfc"/>
    </g>
    <!-- Card 3 -->
    <g transform="translate(20 320) rotate(2)">
      <rect width="220" height="120" rx="18" fill="url(#card)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
      <rect x="20" y="22" width="80" height="12" rx="6" fill="rgba(255,255,255,.7)"/>
      <rect x="20" y="46" width="150" height="8" rx="4" fill="rgba(255,255,255,.35)"/>
      <rect x="20" y="62" width="120" height="8" rx="4" fill="rgba(255,255,255,.35)"/>
    </g>
  </g>
</svg>
