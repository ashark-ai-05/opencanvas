# Railway service config for the public OpenCanvas demo.
# https://docs.railway.app/reference/config-as-code

[build]
# Use the multi-stage Dockerfile in the repo root — Railway's
# Nixpacks autodetect doesn't handle the dual-build (Vite SPA +
# Node backend) without help.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The container's CMD already starts the server. PORT is injected by
# Railway and read in src/backend/server.ts.
startCommand = "pnpm tsx src/backend/server.ts"
healthcheckPath = "/v1/health"
healthcheckTimeout = 30
# If the deploy fails health checks, roll back to the previous version
# rather than serving a broken container.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envVars]
# Required at deploy time. Set the actual values in Railway's
# dashboard → Variables, not here. Listing them here is documentation;
# Railway doesn't write secrets to config-as-code.
OPENCANVAS_DEMO        = "1"
HOST                   = "0.0.0.0"
NODE_ENV               = "production"
# Provider profile:
#   - GOOGLE_API_KEY (set in Railway dashboard) → required, from aistudio.google.com
#   - OPENCANVAS_LLM_PROVIDER=gemini            → switches the default profile
#   - OPENCANVAS_LLM_MODEL=gemini-2.0-flash     → free tier, ~15 RPM, 1500 RPD
OPENCANVAS_LLM_PROVIDER = "gemini"
OPENCANVAS_LLM_MODEL    = "gemini-2.0-flash"
