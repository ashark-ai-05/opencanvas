<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <clipPath id="chatClip"><rect x="40" y="88" width="380" height="290" rx="12"/></clipPath>
    <clipPath id="canvasClip"><rect x="500" y="88" width="420" height="290" rx="12"/></clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#3f3f46" opacity="0.55"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="960" height="420" rx="20" fill="#0b0b0f"/>

  <!-- headings -->
  <text x="40" y="52" font-size="15" font-weight="700" fill="#a1a1aa" letter-spacing="1.6">A CHAT APP</text>
  <text x="500" y="52" font-size="15" font-weight="700" fill="url(#accent)" letter-spacing="1.6">OPENCANVAS</text>
  <text x="40" y="74" font-size="13" fill="#71717a">"break down Q3 sales by region and suggest follow-ups"</text>
  <text x="500" y="74" font-size="13" fill="#71717a">same prompt, same model</text>

  <!-- ================= LEFT: the scrolling wall ================= -->
  <rect x="40" y="88" width="380" height="290" rx="12" fill="#131318" stroke="#27272a"/>
  <g clip-path="url(#chatClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -330" dur="9s" repeatCount="indefinite"/>
      <!-- copy 1 -->
      <g fill="#3f3f46">
        <rect x="60" y="104" width="300" height="9" rx="4.5"/><rect x="60" y="122" width="336" height="9" rx="4.5"/>
        <rect x="60" y="140" width="272" height="9" rx="4.5"/><rect x="60" y="158" width="318" height="9" rx="4.5"/>
        <rect x="60" y="184" width="200" height="9" rx="4.5" fill="#52525b"/>
        <rect x="60" y="202" width="330" height="9" rx="4.5"/><rect x="60" y="220" width="290" height="9" rx="4.5"/>
        <rect x="60" y="238" width="340" height="9" rx="4.5"/><rect x="60" y="256" width="250" height="9" rx="4.5"/>
        <rect x="60" y="282" width="300" height="9" rx="4.5"/><rect x="60" y="300" width="336" height="9" rx="4.5"/>
        <rect x="60" y="318" width="272" height="9" rx="4.5"/><rect x="60" y="336" width="318" height="9" rx="4.5"/>
        <rect x="60" y="362" width="200" height="9" rx="4.5" fill="#52525b"/>
        <rect x="60" y="380" width="330" height="9" rx="4.5"/><rect x="60" y="398" width="290" height="9" rx="4.5"/>
      </g>
      <!-- the one thing you asked for, buried -->
      <g transform="translate(60 268)">
        <rect width="200" height="9" rx="4.5" fill="#2dd4bf" opacity="0.9"/>
        <text x="208" y="9" font-size="11" fill="#5eead4" font-style="italic">← the table you wanted</text>
      </g>
      <!-- copy 2 (seamless loop) -->
      <g fill="#3f3f46" transform="translate(0 330)">
        <rect x="60" y="104" width="300" height="9" rx="4.5"/><rect x="60" y="122" width="336" height="9" rx="4.5"/>
        <rect x="60" y="140" width="272" height="9" rx="4.5"/><rect x="60" y="158" width="318" height="9" rx="4.5"/>
        <rect x="60" y="184" width="200" height="9" rx="4.5" fill="#52525b"/>
        <rect x="60" y="202" width="330" height="9" rx="4.5"/><rect x="60" y="220" width="290" height="9" rx="4.5"/>
        <rect x="60" y="238" width="340" height="9" rx="4.5"/><rect x="60" y="256" width="250" height="9" rx="4.5"/>
        <rect x="60" y="282" width="300" height="9" rx="4.5"/><rect x="60" y="300" width="336" height="9" rx="4.5"/>
        <rect x="60" y="318" width="272" height="9" rx="4.5"/><rect x="60" y="336" width="318" height="9" rx="4.5"/>
        <rect x="60" y="362" width="200" height="9" rx="4.5" fill="#52525b"/>
        <rect x="60" y="380" width="330" height="9" rx="4.5"/><rect x="60" y="398" width="290" height="9" rx="4.5"/>
      </g>
      <g transform="translate(60 598)">
        <rect width="200" height="9" rx="4.5" fill="#2dd4bf" opacity="0.9"/>
        <text x="208" y="9" font-size="11" fill="#5eead4" font-style="italic">← the table you wanted</text>
      </g>
    </g>
  </g>
  <!-- scrollbar thumb -->
  <rect x="408" y="100" width="4" height="40" rx="2" fill="#3f3f46">
    <animate attributeName="y" values="100;326;100" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="40" y="404" font-size="13" fill="#71717a">scroll · copy · paste · lose the thread</text>

  <!-- ================= RIGHT: the canvas ================= -->
  <rect x="500" y="88" width="420" height="290" rx="12" fill="#131318" stroke="#27272a"/>
  <rect x="500" y="88" width="420" height="290" rx="12" fill="url(#dots)"/>

  <g clip-path="url(#canvasClip)">
    <!-- chart widget -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.08;0.16;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
      <rect x="516" y="104" width="200" height="126" rx="8" fill="#18181b" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="528" y="122" font-size="11" font-weight="600" fill="#e4e4e7">Q3 sales by region</text>
      <g fill="#2dd4bf">
        <rect x="532" y="214" width="26" height="0"><animate attributeName="height" values="0;0;62;62;62;0" keyTimes="0;0.16;0.28;0.86;0.94;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="214;214;152;152;152;214" keyTimes="0;0.16;0.28;0.86;0.94;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="570" y="214" width="26" height="0" opacity="0.8"><animate attributeName="height" values="0;0;84;84;84;0" keyTimes="0;0.18;0.3;0.86;0.94;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="214;214;130;130;130;214" keyTimes="0;0.18;0.3;0.86;0.94;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="608" y="214" width="26" height="0" opacity="0.65"><animate attributeName="height" values="0;0;46;46;46;0" keyTimes="0;0.2;0.32;0.86;0.94;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="214;214;168;168;168;214" keyTimes="0;0.2;0.32;0.86;0.94;1" dur="9s" repeatCount="indefinite"/></rect>
        <rect x="646" y="214" width="26" height="0" opacity="0.5"><animate attributeName="height" values="0;0;70;70;70;0" keyTimes="0;0.22;0.34;0.86;0.94;1" dur="9s" repeatCount="indefinite"/><animate attributeName="y" values="214;214;144;144;144;214" keyTimes="0;0.22;0.34;0.86;0.94;1" dur="9s" repeatCount="indefinite"/></rect>
      </g>
      <line x1="528" y1="214" x2="704" y2="214" stroke="#3f3f46"/>
    </g>

    <!-- table widget -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.3;0.38;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0;0 0" keyTimes="0;0.3;0.38;1" dur="9s" repeatCount="indefinite"/>
      <rect x="728" y="104" width="176" height="126" rx="8" fill="#18181b" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="740" y="122" font-size="11" font-weight="600" fill="#e4e4e7">Region · Δ QoQ</text>
      <g font-size="10" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="740" y="146">APAC</text><text x="892" y="146" text-anchor="end" fill="#5eead4">+18%</text>
        <text x="740" y="166">EMEA</text><text x="892" y="166" text-anchor="end" fill="#5eead4">+6%</text>
        <text x="740" y="186">NA</text><text x="892" y="186" text-anchor="end" fill="#fca5a5">−3%</text>
        <text x="740" y="206">LATAM</text><text x="892" y="206" text-anchor="end" fill="#5eead4">+11%</text>
      </g>
      <g stroke="#27272a"><line x1="740" y1="152" x2="892" y2="152"/><line x1="740" y1="172" x2="892" y2="172"/><line x1="740" y1="192" x2="892" y2="192"/></g>
    </g>

    <!-- kanban widget -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.48;0.56;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0;0 0" keyTimes="0;0.48;0.56;1" dur="9s" repeatCount="indefinite"/>
      <rect x="516" y="244" width="388" height="96" rx="8" fill="#18181b" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="528" y="262" font-size="11" font-weight="600" fill="#e4e4e7">Follow-ups</text>
      <g font-size="10" fill="#a1a1aa">
        <text x="528" y="282" fill="#71717a">TODO</text>
        <rect x="528" y="288" width="110" height="18" rx="4" fill="#27272a"/><text x="534" y="300" fill="#e4e4e7">Call NA lead</text>
        <rect x="528" y="310" width="110" height="18" rx="4" fill="#27272a"/><text x="534" y="322" fill="#e4e4e7">Re-forecast Q4</text>
        <text x="656" y="282" fill="#71717a">DOING</text>
        <rect x="656" y="288" width="110" height="18" rx="4" fill="#27272a"/><text x="662" y="300" fill="#e4e4e7">APAC hiring plan</text>
        <text x="784" y="282" fill="#71717a">DONE</text>
        <rect x="784" y="288" width="110" height="18" rx="4" fill="#27272a"/><text x="790" y="300" fill="#e4e4e7">Board deck</text>
      </g>
    </g>

    <!-- cursor drags the chart a little -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.64;0.68;0.8;0.84;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;14 -6;14 -6" keyTimes="0;0.68;0.8;1" dur="9s" repeatCount="indefinite"/>
      <path d="M700 226 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z" fill="#fafafa" stroke="#0b0b0f" stroke-width="1"/>
    </g>
  </g>

  <!-- chat breadcrumb under the canvas -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.56;0.62;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
    <rect x="500" y="388" width="420" height="24" rx="12" fill="#18181b" stroke="#27272a"/>
    <circle cx="514" cy="400" r="4" fill="url(#accent)"/>
    <text x="526" y="404" font-size="12" fill="#a1a1aa">Placed 3 widgets: chart, table, follow-ups. Drag, pin, or ask for more.</text>
  </g>
</svg>
