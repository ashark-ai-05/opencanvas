# pnpm project settings. pnpm 11+ no longer reads the `pnpm` field in
# package.json, and dependabot uses the latest pnpm unless packageManager
# pins it — so settings live here, where every pnpm version finds them.

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - electron

# Transitive vulnerability pins (see `pnpm audit --prod`).
overrides:
  '@tootallnate/once': '^3.0.1'
  '@anthropic-ai/sdk': '^0.95.1'
  ip-address: '^10.3.1'
  protobufjs: '^7.6.5'
  qs: '^6.16.0'
  ws: '^8.20.1'
  '@xmldom/xmldom': '^0.8.15'
  adm-zip: '^0.6.1'
  dompurify: '^3.4.13'
  fast-uri: '^3.1.6'
  linkify-it: '^5.0.2'
  markdown-it: '^14.2.0'
  sharp: '^0.35.4'
  # 2026-09-27 audit sweep (mostly electron-builder / vite / node-gyp transitives)
  tar: '^7.5.21'
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'
  postcss: '^8.5.23'
  browserslist: '^4.28.7'
  baseline-browser-mapping: '^2.11.0'
  tmp: '^0.2.6'
  form-data: '^4.0.6'
  body-parser: '^2.3.0'
  '@babel/core': '^7.29.6'
  builder-util-runtime: '^9.7.0'
  'undici@6': '^6.28.0'
  'undici@7': '^7.29.0'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'

auditConfig:
  ignoreGhsas:
    # @tiptap/core mergeAttributes prototype pollution, fixed in 3.30.4.
    # Only reachable via tldraw 3.x (pins tiptap 2.x); tldraw 4+ needs a
    # commercial licence. We never pass user JSON into tiptap attribute
    # merging, so the vulnerable path is unreachable in OpenCanvas.
    - GHSA-cp6q-959q-f8rh
